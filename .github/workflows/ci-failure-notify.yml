name: CI Failure Slack Notify

on:
  workflow_run:
    workflows:
      - "AI Rules Drift Check"
      - "CI"
      - "Cloudflare Readiness Evidence"
      - "Fix Issue Headings"
      - "Merge Quality Gate"
      - "Migrate D1"
      - "Migration Label"
      - "PR Auto Setting"
      - "Protect main branch"
      - "Quality Eval"
      - "Quarterly D1 Backup"
      - "Security Audit"
      # 入れ子に見えるが必要。Slack Error Notify は webhook (SLACK_ERROR_WEBHOOK_URL) を叩き、
      # こっちは bot token (chat.postMessage) を使う別経路なので、webhook の URL 失効や
      # あちら側の bash/jq バグは「Slack 全体が落ちとる」場合と違ってこっちで拾える。
      # ここを外すと Slack Error Notify の失敗を見る仕組みが repo 内に1つも無くなる。
      - "Slack Error Notify"
      - "TruffleHog Secret Scan"
    types: [completed]
    branches: [main, develop]

jobs:
  notify-failure:
    name: Notify Slack on failure
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != github.workflow
    steps:
      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${COMMIT_SHA}"

          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "🚨 ${WORKFLOW_NAME} が ${HEAD_BRANCH} ブランチで失敗しました" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$HEAD_BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg short_sha "$SHORT_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              channel: $channel,
              text: $text,
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: ("🚨 CI/CD 失敗通知（" + $branch + " ブランチ）"),
                    emoji: true
                  }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ("*ワークフロー:*\n" + $workflow) },
                    { type: "mrkdwn", text: ("*ブランチ:*\n`" + $branch + "`") },
                    { type: "mrkdwn", text: ("*実行者:*\n" + $actor) },
                    { type: "mrkdwn", text: ("*コミット:*\n<" + $commit_url + "|" + $short_sha + ">") }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "📋 ログを確認", emoji: true },
                      url: $run_url,
                      style: "danger"
                    }
                  ]
                }
              ]
            }')

          RESPONSE=$(curl -sf -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || true

          if [ -z "$RESPONSE" ]; then
            echo "::error::Slack API request failed (network error or empty response)"
            exit 1
          fi

          if ! echo "$RESPONSE" | jq -e '.ok == true' > /dev/null; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error // "unknown_error"')
            echo "::error::Slack API error: ${ERROR}"
            exit 1
          fi
